[package]
name = "stipe"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
authors = ["William Newton"]
description = "Ecosystem installer and manager for Basidiocarp"
license = "MIT"
repository = "https://github.com/basidiocarp/stipe"
keywords = ["basidiocarp", "installer", "mcp", "ecosystem", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "stipe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spore = { path = "../spore" }
tar = "0.4"
which = "7"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
