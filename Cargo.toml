[package]
name = "stipe"
version = "0.8.3"
edition = "2024"
rust-version = "1.85"
authors = ["William Newton"]
description = "Ecosystem installer and manager for Basidiocarp"
license = "MIT"
repository = "https://github.com/basidiocarp/stipe"
keywords = ["basidiocarp", "installer", "mcp", "ecosystem", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "stipe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
flate2 = "1.0"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
spore = { git = "https://github.com/basidiocarp/spore", rev = "967e10c43a1052c9e57e226227621a83e6ac20e4" }
tar = "0.4"
toml = "1"
tempfile = "3"
wait-timeout = "0.2"
which = "7"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
indicatif = "0.17"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pre-existing pedantic violations to be addressed incrementally.
explicit_iter_loop = "allow"
uninlined_format_args = "allow"
